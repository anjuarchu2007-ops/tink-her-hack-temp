<!DOCTYPE html>
<html>
<head>
    <title>Voter Registration - Zero Trace</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        h1 {
            font-weight: bold;
            color: black;
            margin-top: 20px;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
        }

        .container {
            background: white;
            width: 400px;
            margin: 30px auto;
            padding: 30px;
            border: 2px solid black;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border: 1px solid black;
            background-color: #f9f9f9;
        }

        .button-group {
            margin-top: 20px;
        }

        button {
            padding: 12px 25px;
            background-color: black;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            border-radius: 5px;
            margin: 5px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #333;
        }

        .back-btn {
            background-color: #666;
        }

        .back-btn:hover {
            background-color: #444;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

    <h1>ZERO TRACE</h1>
    <h2>Voter Registration Form</h2>

    <div class="container">
        <h3>Enter Your Details</h3>

        <input type="text" id="voterId" placeholder="Enter Numeric Voter ID">
        <input type="number" id="age" placeholder="Enter Age">
        <input type="email" id="email" placeholder="Enter Email Address">
        <input type="text" id="name" placeholder="Enter Full Name">

        <div class="button-group">
            <button onclick="validateRegistration()">Submit Registration</button>
            <button class="back-btn" onclick="goBack()">Back</button>
        </div>

        <div id="result"></div>
    </div>

    <script>
    function validateRegistration() {
        var voterId = document.getElementById("voterId").value;
        var age = document.getElementById("age").value;
        var email = document.getElementById("email").value;
        var name = document.getElementById("name").value;
        var result = document.getElementById("result");

        if (voterId === "" || age === "" || email === "" || name === "") {
            result.classList.remove("success");
            result.innerHTML = "❌ Invalid Registration - All fields are required";
            return;
        }

        var numericPattern = /^[0-9]+$/;
        if (!numericPattern.test(voterId)) {
            result.classList.remove("success");
            result.innerHTML = "❌ Invalid Registration - Voter ID must contain only numbers";
            return;
        }

        if (age < 18) {
            result.classList.remove("success");
            result.innerHTML = "❌ Invalid Registration - You must be at least 18 years old";
            return;
        }

        var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(email)) {
            result.classList.remove("success");
            result.innerHTML = "❌ Invalid Registration - Please enter a valid email address";
            return;
        }

        // ✅ STORE USING CONSISTENT KEYS
        sessionStorage.setItem("voterId", voterId);
        sessionStorage.setItem("voterName", name);
        sessionStorage.setItem("voterEmail", email);
        sessionStorage.setItem("voterAge", age);

        result.classList.add("success");
        result.innerHTML = "✅ Registration Successful! Redirecting...";

        setTimeout(function() {
            window.location.href = "candidates.html";
        }, 2000);
    }

    function goBack() {
        window.location.href = "index.html";
    }
</script>

</body>
</html>
