
<!DOCTYPE html>
<html>
<head>
    <title>Zero Trace - Voter Registration</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-weight: 700;
            color: white;
            font-size: 56px;
            margin-bottom: 10px;
            text-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            letter-spacing: 2px;
        }

        h2 {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 40px;
            font-size: 22px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 50px 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h3 {
            font-size: 28px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 700;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        button {
            padding: 14px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 40px;
            }
            h2 {
                font-size: 18px;
            }
            .container {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <h1>ZERO TRACE</h1>
    <h2>Voting System</h2>

    <div class="container">
        <h3>Welcome to Voter Registration</h3>
        <p>
            This platform ensures secure, transparent, and tamper-proof voter registration 
            using blockchain technology. Your vote matters!
        </p>
        <button onclick="goToRegistration()">Start Registration</button>
    </div>

    <script>
        function goToRegistration() {
            window.location.href = "registration.html";
        }
    </script>

</body>
</html><!DOCTYPE html>
