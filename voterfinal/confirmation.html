<!DOCTYPE html>
<html>
<head>
    <title>Vote Confirmation</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f2f2f2;
        }

        h1 {
            font-weight: bold;
            color: black;
            margin-top: 40px;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border: 2px solid black;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            background: black;
            color: white;
            border: none;
            cursor: pointer;
            margin: 10px;
        }
    </style>
</head>

<body>

<h1>ZERO TRACE</h1>
<h2>Vote Confirmation</h2>

<div class="box">
    <h3>Confirm Your Vote</h3>

    <p id="voterDetails"></p>

    <button onclick="finalConfirmVote()">Confirm Vote</button>
    <button onclick="downloadCSV()">Download CSV (Admin)</button>
</div>

<script>

window.onload = function() {

    var voterId = sessionStorage.getItem("voterId");
    var age = sessionStorage.getItem("voterAge");
    var candidate = sessionStorage.getItem("votedCandidate");

    document.getElementById("voterDetails").innerHTML =
        "Voter ID: " + voterId + "<br>" +
        "Age: " + age + "<br>" +
        "Selected Candidate: " + candidate;
};


function finalConfirmVote() {

    var voterId = sessionStorage.getItem("voterId");
    var age = sessionStorage.getItem("voterAge");
    var candidate = sessionStorage.getItem("votedCandidate");

    if (!voterId || !age || !candidate) {
        alert("Error: Missing voter data.");
        return;
    }

    var votes = JSON.parse(localStorage.getItem("allVotes")) || [];

    votes.push({
        voterId: voterId,
        age: age,
        candidate: candidate
    });

    localStorage.setItem("allVotes", JSON.stringify(votes));

    alert("✅ Vote Stored Successfully!");

    // Clear current session so next person can vote
    sessionStorage.clear();

    window.location.href = "index.html";
}



function downloadCSV() {

    var votes = JSON.parse(localStorage.getItem("allVotes")) || [];

    if (votes.length === 0) {
        alert("No votes recorded yet.");
        return;
    }

    var csv = "Voter ID,Age,Candidate\n";

    votes.forEach(function(vote) {
        csv += vote.voterId + "," + vote.age + "," + vote.candidate + "\n";
    });

    var blob = new Blob([csv], { type: "text/csv" });
    var url = URL.createObjectURL(blob);

    var a = document.createElement("a");
    a.href = url;
    a.download = "all_votes.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

</script>

</body>
</html>
