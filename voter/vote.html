<!DOCTYPE html>
<html>
<head>
    <title>Vote</title>
    <style>
        body { font-family: Arial; text-align: center; }
        button { padding: 8px 15px; background: black; color: white; border: none; margin: 5px; }
    </style>
</head>
<body>

<h2>Select Candidate</h2>

<button onclick="selectCandidate('Candidate A')">Candidate A</button>
<button onclick="selectCandidate('Candidate B')">Candidate B</button>

<script>
function selectCandidate(name) {
    localStorage.setItem("candidate", name);
    window.location.href = "confirm.html";
}
</script>

</body>
</html>
